name: Build my OpenClaw

# Runs ONLY when you click "Run workflow" in the Actions tab.
# Nothing changes on its own.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: Get my code
        uses: actions/checkout@v4

      - name: Set up Docker builder
        uses: docker/setup-buildx-action@v3

      - name: Log in to my GitHub image storage
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and save my image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            OPENCLAW_INSTALL_BROWSER=1
          tags: |
            ghcr.io/${{ github.repository_owner }}/openclaw:mine
            ghcr.io/${{ github.repository_owner }}/openclaw:mine-${{ github.run_number }}
